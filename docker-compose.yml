services:
  postgres:
    image: postgres:17-alpine
    container_name: restaurant-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_platform
      POSTGRES_USER: restaurant_app
      POSTGRES_PASSWORD: restaurant_dev_password
    ports:
      - "5432:5432"
    volumes:
      - restaurant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_app -d restaurant_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: restaurant-platform-backend
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      QR_SECRET: ${QR_SECRET}
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://restaurant_app:restaurant_dev_password@postgres:5432/restaurant_platform?schema=public
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: restaurant-platform-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  restaurant_postgres_data:
